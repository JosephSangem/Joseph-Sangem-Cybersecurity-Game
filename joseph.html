
<!DOCTYPE html>
<html>
<head>
    <title>Password Defender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1>🛡️ Password Defender</h1>
        <p>Is this password strong or weak?</p>

        <h2 id="password">123456</h2>

        <button onclick="check('strong')">STRONG</button>
        <button onclick="check('weak')">WEAK</button>

        <h3 id="feedback"></h3>
        <p>Score: <span id="score">0</span></p>
        <button onclick="next()">Next Password →</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
