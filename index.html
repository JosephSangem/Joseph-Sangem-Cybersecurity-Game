<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield - Password Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>CyberShield: Pick the Strongest Password</h1>

    <div id="gameScreen">
      <div class="score-board">
        <span>Question <span id="currentQ">1</span>/5</span>
        <span>Score: <span id="score">0</span></span>
      </div>

      <p class="prompt">Select the safest and strongest password below:</p>

      <div id="optionsGrid" class="options-grid"></div>

      <div id="feedback" class="feedback hidden"></div>

      <button id="nextBtn" class="next-btn hidden">Next Question ➔</button>
    </div>

    <div id="resultScreen" class="result-card hidden">
      <h2>Game Complete!</h2>
      <p class="final-text">Your final score: <strong id="finalScore">0</strong>/50</p>
      <p id="rankText"></p>
      <button id="restartBtn" class="restart-btn">Play Again 🔄</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
